{% extends "base.html" %}
{% block content %}
<div class="page">
    <div class="page-heading"><div><div class="eyebrow">FINANCE</div><h1>Expenses</h1></div></div>
    <div class="form-card">
        <form method="post" class="form-grid three">
            <div><label>Description</label><input name="description" required></div>
            <div><label>Amount</label><input name="amount" type="number" min="0" step="1" required></div>
            <div><label>Date</label><input name="expense_date" type="date" value="{{ today }}" required></div>
            <button class="gold-btn" type="submit">Add Expense</button>
        </form>
    </div>
    <div class="table-card">
        <table><thead><tr><th>Description</th><th>Amount</th><th>Date</th></tr></thead>
        <tbody>{% for e in expenses %}<tr><td>{{ e.description }}</td><td>₹{{ "%.0f"|format(e.amount) }}</td><td>{{ e.expense_date }}</td></tr>{% else %}<tr><td colspan="3" class="empty-state">No expenses yet.</td></tr>{% endfor %}</tbody>
        </table>
    </div>
</div>
{% endblock %}
